name: Convert OpenShift Docs to Markdown

on:
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      distro:
        description: 'Target distro'
        required: false
        default: 'openshift-enterprise'
      version_count:
        description: 'Number of latest versions to convert'
        required: false
        default: '3'
      topics:
        description: 'Comma-separated topic dirs (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone openshift-docs
        run: |
          git clone --depth 1 \
            https://github.com/openshift/openshift-docs.git

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install asciidoctor
        run: gem install asciidoctor

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Discover versions
        id: versions
        run: |
          VERSIONS=$(python convert.py \
            --source-dir ./openshift-docs \
            --distro ${{ github.event.inputs.distro || 'openshift-enterprise' }} \
            --discover-versions ${{ github.event.inputs.version_count || '3' }})
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Discovered versions: $VERSIONS"

      - name: Clean output directory
        run: rm -rf ./docs && mkdir -p ./docs

      - name: Convert all versions
        run: |
          DISTRO="${{ github.event.inputs.distro || 'openshift-enterprise' }}"
          TOPICS="${{ github.event.inputs.topics || '' }}"
          for row in $(echo '${{ steps.versions.outputs.versions }}' | jq -c '.[]'); do
            VERSION=$(echo "$row" | jq -r '.version')
            BRANCH=$(echo "$row" | jq -r '.branch')
            echo "::group::Converting version $VERSION (branch: $BRANCH)"
            cd openshift-docs && git fetch --depth 1 origin "$BRANCH" && git checkout FETCH_HEAD && cd ..
            python convert.py \
              --source-dir ./openshift-docs \
              --output-dir "./docs/$VERSION" \
              --distro "$DISTRO" \
              --branch "$BRANCH" \
              --topics "$TOPICS" \
              --workers 4
            echo "::endgroup::"
          done

      - name: Generate top-level index
        run: python convert.py --output-dir ./docs --generate-top-index

      - name: Commit docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update multi-version openshift-docs conversion"
            git pull --rebase origin main
            git push
          fi
